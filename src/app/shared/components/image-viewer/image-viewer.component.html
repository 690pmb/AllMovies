<ng-container *ngIf="visible">
  <!-- Modal for fullscreen -->
  <app-modal
    [visible]="isFullscreen"
    (update)="closeFullscreen($event)"
    [closeBtn]="closeBtn"
  >
    <pinch-zoom [disableZoomControl]="'disable'">
      <img
        src="{{ fullScreenImg | image : imageSize.full }}"
        class="fullscreen"
      />
    </pinch-zoom>
  </app-modal>
  <!-- Swiper for gallery of images -->
  <ng-container *ngIf="!isOnePicture">
    <!-- Full size gallery -->
    <div #galleryTop class="gallery-top">
      <swiper
        *ngIf="images?.length"
        [slidesPerView]="config.slidesPerView"
        [keyboard]="config.keyboard"
        [mousewheel]="config.mousewheel"
        [navigation]="config.navigation"
        [pagination]="config.pagination"
        [scrollbar]="config.scrollbar"
        [slideToClickedSlide]="config.slideToClickedSlide"
        [zoom]="config.zoom"
        [a11y]="config.a11y"
        [touchEventsTarget]="config.touchEventsTarget"
        [direction]="config.direction"
        [spaceBetween]="config.spaceBetween"
        [touchEventsTarget]="config.touchEventsTarget"
        [thumbs]="{swiper: thumbsSwiper}"
        (activeIndexChange)="onActiveIndexChange($event)"
      >
        <ng-template swiperSlide *ngFor="let img of images">
          <pinch-zoom [disableZoomControl]="'disable'">
            <img src="{{ img | image : imageSize.full }}" />
          </pinch-zoom>
        </ng-template>
      </swiper>
      <span (click)="fullscreen()" class="expand" *ngIf="!isFullscreen">
        <fa-icon [icon]="faExpand"></fa-icon>
      </span>
    </div>
    <!-- Thumbnails gallery -->
    <div class="gallery-thumbs" #galleryThumbs>
      <swiper
        *ngIf="thumbnails?.length"
        [slidesPerView]="thumbs.slidesPerView"
        [mousewheel]="thumbs.mousewheel"
        [slideToClickedSlide]="thumbs.slideToClickedSlide"
        [watchSlidesProgress]="true"
        (swiper)="thumbsSwiper = $event"
      >
        <ng-template swiperSlide *ngFor="let thumb of thumbnails">
          <img
            src="{{ thumb | image : imageSize.medium }}"
            #img
            [class.portrait]="isPortrait"
          />
        </ng-template>
      </swiper>
    </div>
  </ng-container>
  <!-- One picture display -->
  <ng-container *ngIf="isOnePicture">
    <pinch-zoom class="frame-viewer pointer" [disableZoomControl]="'disable'">
      <img
        src="{{ thumbnails | image : imageSize.medium }}"
        (click)="fullscreen()"
      />
    </pinch-zoom>
  </ng-container>
</ng-container>
